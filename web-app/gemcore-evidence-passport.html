<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GemCore Evidence Passport</title><style>body{margin:0;background:#02090c;color:#eafffb;font:14px system-ui}.wrap{max-width:1000px;margin:auto;padding:22px}a{color:#45f4df}.head,.item{border:1px solid #18515a;background:#06171c;border-radius:16px;padding:16px;margin:12px 0}.tag{display:inline-block;border:1px solid #27877e;border-radius:999px;padding:5px 9px;color:#6fffc4}.muted{color:#7fa4a7}button{background:#087b70;color:white;border:1px solid #36dfc6;border-radius:10px;padding:10px 14px}</style></head><body><div class="wrap"><div class="head"><a href="gemcore-grading.html">← Grading Lab</a><h1>◇ Evidence Passport</h1><p class="muted">Prototype evidence ledger. Production passports will use authenticated, server-side immutable records.</p><button id="new">Create Test Submission</button></div><div id="list"></div></div><script src="js/gemcore-store.js"></script><script>const list=document.querySelector('#list');function draw(){const a=GemCoreStore.list();list.innerHTML=a.length?a.map(x=>'<div class="item"><span class="tag">'+x.status+'</span><h3>'+x.id+'</h3><div>Created: '+new Date(x.createdAt).toLocaleString()+'</div><div>Evidence items: '+x.evidence.length+'</div><div>Human QC: '+(x.qc.approved?'Approved by '+x.qc.reviewer:'Required')+'</div></div>').join(''):'<div class="item muted">No local prototype submissions yet.</div>'}document.querySelector('#new').onclick=()=>{GemCoreStore.create({type:'collectible',source:'prototype'});draw()};draw()</script></body></html>
