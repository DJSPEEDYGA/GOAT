<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gm-gem" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8fffee"/><stop offset=".4" stop-color="#25f3e6"/>
      <stop offset=".8" stop-color="#0ea898"/><stop offset="1" stop-color="#086b60"/>
    </linearGradient>
    <linearGradient id="gm-tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0e2c3e"/><stop offset="1" stop-color="#040d16"/>
    </linearGradient>
    <radialGradient id="gm-core" cx=".5" cy=".5" r=".5">
      <stop stop-color="#eafffb"/><stop offset=".4" stop-color="#25f3e6"/>
      <stop offset="1" stop-color="#25f3e6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- dark rounded tile -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#gm-tile)" stroke="#1a3a4d" stroke-width="1.5"/>
  <rect x="10" y="10" width="108" height="108" rx="20" fill="none" stroke="#25f3e6" stroke-width=".6" opacity=".25"/>

  <!-- faceted gem (brilliant cut, crown up) -->
  <g stroke-linejoin="round">
    <!-- pavilion outline -->
    <path d="M64 100 36 64 44 44 64 36 84 44 92 64z" fill="url(#gm-gem)"/>
    <!-- crown facets -->
    <path d="M44 44 64 58 84 44" fill="none" stroke="#eafffb" stroke-width="1.2" opacity=".8"/>
    <path d="M36 64 56 58h16l20 6" fill="none" stroke="#eafffb" stroke-width="1" opacity=".55"/>
    <path d="M64 36v22M44 44l12 14M84 44l-12 14" fill="none" stroke="#eafffb" stroke-width="1" opacity=".6"/>
    <path d="M56 58 64 100l8-42" fill="none" stroke="#eafffb" stroke-width=".9" opacity=".5"/>
    <path d="M36 64l28 36M92 64l-28 36" fill="none" stroke="#eafffb" stroke-width=".9" opacity=".4"/>
  </g>

  <!-- glowing core -->
  <circle cx="64" cy="58" r="11" fill="url(#gm-core)"/>
  <circle cx="64" cy="58" r="3.4" fill="#fff"/>

  <!-- circuit traces from the point -->
  <g stroke="#25f3e6" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M64 100v8"/>
    <path d="M52 92l-8 10"/>
    <path d="M76 92l8 10"/>
  </g>
  <circle cx="64" cy="112" r="2.4" fill="#25f3e6"/>
  <circle cx="41" cy="105" r="2.4" fill="#25f3e6"/>
  <circle cx="87" cy="105" r="2.4" fill="#25f3e6"/>
</svg>
