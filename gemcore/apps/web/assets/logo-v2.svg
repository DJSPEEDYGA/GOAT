<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="lg-gem" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7dfff1"/><stop offset=".35" stop-color="#25f3e6"/>
      <stop offset=".7" stop-color="#0ea898"/><stop offset="1" stop-color="#055048"/>
    </linearGradient>
    <linearGradient id="lg-frame" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e8eef2"/><stop offset=".45" stop-color="#9fb4c0"/>
      <stop offset=".55" stop-color="#5a7482"/><stop offset="1" stop-color="#2a3d4a"/>
    </linearGradient>
    <linearGradient id="lg-dark" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0e2c3e"/><stop offset="1" stop-color="#040d16"/>
    </linearGradient>
    <radialGradient id="lg-glow" cx=".5" cy=".38" r=".55">
      <stop stop-color="#25f3e6" stop-opacity=".55"/><stop offset="1" stop-color="#25f3e6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- outer metallic frame -->
  <path d="M64 6 114 24v30c0 30-20 51-50 68C34 105 14 84 14 54V24z" fill="url(#lg-frame)"/>
  <path d="M64 10 110 27v27c0 27-18 47-46 62-28-15-46-35-46-62V27z" fill="url(#lg-dark)"/>
  <!-- inner field -->
  <path d="M64 16 104 31v23c0 24-16 42-40 56-24-14-40-32-40-56V31z" fill="#061420"/>
  <ellipse cx="64" cy="62" rx="36" ry="34" fill="url(#lg-glow)"/>

  <!-- faceted gem -->
  <g>
    <path d="M64 34 88 50 79 82 64 96 49 82 40 50z" fill="url(#lg-gem)"/>
    <!-- facets -->
    <path d="M64 34v62M40 50h48M49 82 64 34l15 48" stroke="#eafdfb" stroke-width="1.4" fill="none" opacity=".75"/>
    <path d="M40 50 64 96l24-46" stroke="#eafdfb" stroke-width="1" fill="none" opacity=".4"/>
    <path d="M52 42 64 34l12 8" stroke="#fff" stroke-width="1" fill="none" opacity=".8"/>
    <circle cx="64" cy="34" r="2.4" fill="#fff"/>
  </g>

  <!-- GC monogram engraved on base -->
  <text x="64" y="112" text-anchor="middle" font-family="Georgia,serif" font-size="13"
    font-weight="bold" letter-spacing="3" fill="#9fb4c0">GCG</text>
  <!-- frame highlight -->
  <path d="M64 6 114 24v30" fill="none" stroke="#fff" stroke-width="1.2" opacity=".35"/>
</svg>
