<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="lv-gem" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8fffee"/><stop offset=".4" stop-color="#25f3e6"/>
      <stop offset=".8" stop-color="#0ea898"/><stop offset="1" stop-color="#086b60"/>
    </linearGradient>
    <radialGradient id="lv-core" cx=".5" cy=".5" r=".5">
      <stop stop-color="#eafffb"/><stop offset=".4" stop-color="#25f3e6"/>
      <stop offset="1" stop-color="#25f3e6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- faceted gem — crown up, no tile (pops on dark header) -->
  <g stroke-linejoin="round">
    <path d="M64 106 30 62 40 38 64 28 88 38 98 62z" fill="url(#lv-gem)"/>
    <path d="M40 38 64 56 88 38" fill="none" stroke="#eafffb" stroke-width="1.6" opacity=".85"/>
    <path d="M30 62 56 56h16l26 6" fill="none" stroke="#eafffb" stroke-width="1.3" opacity=".55"/>
    <path d="M64 28v28M40 38l16 18M88 38l-16 18" fill="none" stroke="#eafffb" stroke-width="1.3" opacity=".6"/>
    <path d="M56 56 64 106l8-50" fill="none" stroke="#eafffb" stroke-width="1.1" opacity=".5"/>
    <path d="M30 62l34 44M98 62l-34 44" fill="none" stroke="#eafffb" stroke-width="1.1" opacity=".4"/>
    <!-- table facet highlight -->
    <path d="M44 38 64 31l20 7" fill="none" stroke="#fff" stroke-width="1.5" opacity=".8"/>
  </g>

  <!-- glowing core -->
  <circle cx="64" cy="58" r="12" fill="url(#lv-core)"/>
  <circle cx="64" cy="58" r="3.6" fill="#fff"/>

  <!-- circuit traces — the "core" -->
  <g stroke="#25f3e6" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M64 106v8"/>
    <path d="M48 96l-9 12"/>
    <path d="M80 96l9 12"/>
  </g>
  <circle cx="64" cy="118" r="2.6" fill="#25f3e6"/>
  <circle cx="36" cy="111" r="2.6" fill="#25f3e6"/>
  <circle cx="92" cy="111" r="2.6" fill="#25f3e6"/>
</svg>
