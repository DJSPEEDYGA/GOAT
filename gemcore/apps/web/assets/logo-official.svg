<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="glo" cx=".5" cy=".48" r=".5">
      <stop stop-color="#25f3e6" stop-opacity=".55"/><stop offset=".55" stop-color="#25f3e6" stop-opacity=".12"/><stop offset="1" stop-color="#25f3e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gemT" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#bffef8"/><stop offset=".45" stop-color="#25f3e6"/><stop offset="1" stop-color="#0a6d66"/>
    </linearGradient>
    <linearGradient id="gemL" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9cf5ec"/><stop offset="1" stop-color="#0e8f86"/>
    </linearGradient>
    <linearGradient id="gemR" x1="1" y1="0" x2="0" y2="1">
      <stop stop-color="#5ee8db"/><stop offset="1" stop-color="#085550"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f5e3ae"/><stop offset=".5" stop-color="#d9b96a"/><stop offset="1" stop-color="#8a6d2f"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0e2c3e"/><stop offset="1" stop-color="#040d16"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#tile)" stroke="#1a4a5e" stroke-width="2"/>
  <circle cx="128" cy="128" r="86" fill="url(#glo)"/>

  <!-- HUD hex ring -->
  <path d="M128 22 220 75 220 181 128 234 36 181 36 75 Z" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M128 36 208 82 208 174 128 220 48 174 48 82 Z" fill="none" stroke="#d9b96a" stroke-width="1" opacity=".35" stroke-dasharray="4 6"/>
  <!-- ring nodes -->
  <g fill="#d9b96a">
    <circle cx="128" cy="22" r="5"/><circle cx="220" cy="75" r="4"/><circle cx="220" cy="181" r="4"/>
    <circle cx="128" cy="234" r="5"/><circle cx="36" cy="181" r="4"/><circle cx="36" cy="75" r="4"/>
  </g>
  <circle cx="128" cy="22" r="9" fill="none" stroke="#d9b96a" stroke-width="1.4" opacity=".6"/>
  <circle cx="128" cy="234" r="9" fill="none" stroke="#d9b96a" stroke-width="1.4" opacity=".6"/>

  <!-- faceted gem -->
  <g>
    <path d="M128 62 176 104 128 190 80 104 Z" fill="url(#gemT)" stroke="#bffef8" stroke-width="1.5"/>
    <!-- facet lines -->
    <path d="M128 62 128 190" stroke="#eafdfb" stroke-width=".9" opacity=".55"/>
    <path d="M80 104 176 104" stroke="#eafdfb" stroke-width=".9" opacity=".55"/>
    <path d="M128 62 104 104 128 128 80 104 Z" fill="url(#gemL)" opacity=".85"/>
    <path d="M128 62 152 104 176 104 128 128 Z" fill="url(#gemR)" opacity=".85"/>
    <path d="M104 104 128 190 128 128" fill="#0d9d93" opacity=".55"/>
    <path d="M152 104 128 190 128 128" fill="#073f3b" opacity=".5"/>
    <!-- crown facets -->
    <path d="M104 104 128 62 128 104" fill="#dffcf8" opacity=".35"/>
    <path d="M152 104 128 62 128 104" fill="#8ef4e8" opacity=".3"/>
  </g>

  <!-- circuit traces -->
  <g stroke="#25f3e6" stroke-width="1.4" opacity=".65" fill="none">
    <path d="M48 128 h16 l6 -6 v-10"/>
    <path d="M208 128 h-16 l-6 -6 v-10"/>
    <path d="M128 234 v-14 l8 -8"/>
  </g>
  <circle cx="70" cy="112" r="3" fill="#25f3e6" opacity=".8"/>
  <circle cx="186" cy="112" r="3" fill="#25f3e6" opacity=".8"/>
  <circle cx="136" cy="212" r="3" fill="#25f3e6" opacity=".8"/>
</svg>
