<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="g-glo" cx=".5" cy=".48" r=".5">
      <stop stop-color="#25f3e6" stop-opacity=".55"/><stop offset=".55" stop-color="#25f3e6" stop-opacity=".12"/><stop offset="1" stop-color="#25f3e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f7e7b0"/><stop offset=".45" stop-color="#d9b96a"/><stop offset=".78" stop-color="#8a6d2f"/><stop offset="1" stop-color="#e8cf8e"/>
    </linearGradient>
    <linearGradient id="g-teal" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#bffef8"/><stop offset=".5" stop-color="#25f3e6"/><stop offset="1" stop-color="#0a8f86"/>
    </linearGradient>
    <linearGradient id="g-slab" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1a3a4e" stop-opacity=".9"/><stop offset="1" stop-color="#061521" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="g-glass" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#bffef8" stop-opacity=".22"/><stop offset=".5" stop-color="#bffef8" stop-opacity=".06"/><stop offset="1" stop-color="#bffef8" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="g-shard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0e2c3e"/><stop offset="1" stop-color="#040d16"/>
    </linearGradient>
  </defs>

  <!-- faceted shard silhouette — odd shape, no square -->
  <path d="M128 6 210 34 248 96 240 168 206 226 128 250 50 226 16 168 8 96 46 34 Z"
    fill="url(#g-shard)" stroke="#1a4a5e" stroke-width="2" stroke-linejoin="round"/>
  <path d="M128 6 210 34 190 30 128 250 50 226 66 210 Z" fill="#0a2030" opacity=".35"/>
  <circle cx="128" cy="128" r="88" fill="url(#g-glo)"/>

  <!-- spinning orbit ring (dashed HUD) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 128 128" to="360 128 128" dur="24s" repeatCount="indefinite"/>
    <path d="M128 24 218 76 218 180 128 232 38 180 38 76 Z" fill="none" stroke="#d9b96a" stroke-width="2.5" stroke-dasharray="26 14" stroke-linejoin="round" opacity=".85"/>
    <circle cx="218" cy="76" r="5" fill="#25f3e6"/>
    <circle cx="38" cy="180" r="4" fill="#d9b96a"/>
  </g>
  <!-- counter-spinning inner ring -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 128 128" to="0 128 128" dur="14s" repeatCount="indefinite"/>
    <circle cx="128" cy="128" r="78" fill="none" stroke="#25f3e6" stroke-width="1" stroke-dasharray="4 10" opacity=".4"/>
    <circle cx="128" cy="50" r="3.5" fill="#d9b96a"/>
  </g>

  <!-- THE SLAB — upright case holding the monogram -->
  <g>
    <!-- slab body -->
    <rect x="72" y="66" width="112" height="132" rx="10" fill="url(#g-slab)" stroke="url(#g-teal)" stroke-width="1.6"/>
    <rect x="76" y="70" width="104" height="124" rx="8" fill="url(#g-glass)"/>
    <!-- weld seam -->
    <rect x="72" y="66" width="112" height="132" rx="10" fill="none" stroke="#25f3e6" stroke-width=".6" stroke-dasharray="2 4" opacity=".5" transform="translate(2.5,2.5)"/>
    <!-- label band -->
    <rect x="72" y="66" width="112" height="26" rx="10" fill="url(#g-gold)"/>
    <rect x="72" y="82" width="112" height="10" fill="url(#g-gold)"/>
    <text x="128" y="84" text-anchor="middle" font-family="Orbitron,sans-serif" font-size="11" font-weight="900" fill="#12344a" letter-spacing="1">GCG</text>
    <text x="128" y="178" text-anchor="middle" font-family="monospace" font-size="6" letter-spacing="2" fill="#25f3e6" opacity=".85">◈ GCG-0000001 ◈</text>
    <!-- monogram in the window -->
    <text x="128" y="148" text-anchor="middle" font-family="Orbitron,'Arial Black',sans-serif" font-size="36" font-weight="900" letter-spacing="1" fill="url(#g-gold)" stroke="#3d2f10" stroke-width=".8">GCG</text>
    <text x="128" y="148" text-anchor="middle" font-family="Orbitron,'Arial Black',sans-serif" font-size="36" font-weight="900" letter-spacing="1" fill="none" stroke="url(#g-teal)" stroke-width=".6" opacity=".55">GCG</text>
    <!-- glass streak -->
    <path d="M84 100 L120 92 L96 160 L78 150 Z" fill="#fff" opacity=".07"/>
  </g>

  <!-- floating facet shards, spinning slow -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 128 128" to="360 128 128" dur="34s" repeatCount="indefinite"/>
    <path d="M204 200 l14 -8 8 12 -12 10 Z" fill="url(#g-teal)" opacity=".7"/>
    <path d="M44 52 l12 -6 6 10 -10 8 Z" fill="url(#g-gold)" opacity=".7"/>
    <path d="M214 118 l10 -12 12 6 -8 12 Z" fill="url(#g-teal)" opacity=".5"/>
  </g>
</svg>
