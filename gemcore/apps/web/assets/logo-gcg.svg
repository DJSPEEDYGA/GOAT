<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="g-glo" cx=".5" cy=".48" r=".5">
      <stop stop-color="#25f3e6" stop-opacity=".5"/><stop offset=".55" stop-color="#25f3e6" stop-opacity=".1"/><stop offset="1" stop-color="#25f3e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f7e7b0"/><stop offset=".45" stop-color="#d9b96a"/><stop offset=".78" stop-color="#8a6d2f"/><stop offset="1" stop-color="#e8cf8e"/>
    </linearGradient>
    <linearGradient id="g-teal" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#bffef8"/><stop offset=".5" stop-color="#25f3e6"/><stop offset="1" stop-color="#0a8f86"/>
    </linearGradient>
    <linearGradient id="g-tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0e2c3e"/><stop offset="1" stop-color="#040d16"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#g-tile)" stroke="#1a4a5e" stroke-width="2"/>
  <circle cx="128" cy="128" r="86" fill="url(#g-glo)"/>

  <!-- HUD hex ring -->
  <path d="M128 22 220 75 220 181 128 234 36 181 36 75 Z" fill="none" stroke="url(#g-gold)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M128 36 208 82 208 174 128 220 48 174 48 82 Z" fill="none" stroke="#d9b96a" stroke-width="1" opacity=".35" stroke-dasharray="4 6"/>
  <g fill="#d9b96a">
    <circle cx="128" cy="22" r="5"/><circle cx="220" cy="75" r="4"/><circle cx="220" cy="181" r="4"/>
    <circle cx="128" cy="234" r="5"/><circle cx="36" cy="181" r="4"/><circle cx="36" cy="75" r="4"/>
  </g>
  <circle cx="128" cy="22" r="9" fill="none" stroke="#d9b96a" stroke-width="1.4" opacity=".6"/>
  <circle cx="128" cy="234" r="9" fill="none" stroke="#d9b96a" stroke-width="1.4" opacity=".6"/>

  <!-- GCG monogram — faceted tech type -->
  <g font-family="Orbitron,'Arial Black',sans-serif" font-weight="900" text-anchor="middle">
    <!-- G C in gold, faceted underlay -->
    <text x="128" y="150" font-size="64" letter-spacing="2" fill="url(#g-gold)"
      stroke="#3d2f10" stroke-width="1">GCG</text>
    <text x="128" y="150" font-size="64" letter-spacing="2" fill="none"
      stroke="url(#g-teal)" stroke-width=".8" opacity=".6">GCG</text>
  </g>
  <!-- facet shard through the monogram -->
  <path d="M78 138 L178 118 L186 126 L86 146 Z" fill="#25f3e6" opacity=".12"/>
  <!-- underline: gem facet mark -->
  <path d="M84 172 h88" stroke="url(#g-teal)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M118 172 l10 12 10 -12" fill="url(#g-teal)" opacity=".9"/>
  <text x="128" y="200" text-anchor="middle" font-family="Orbitron,sans-serif" font-size="11"
    letter-spacing="5" fill="#d9b96a">GRADING</text>

  <!-- circuit traces -->
  <g stroke="#25f3e6" stroke-width="1.4" opacity=".6" fill="none">
    <path d="M48 128 h14 l6 -6 v-8"/>
    <path d="M208 128 h-14 l-6 -6 v-8"/>
  </g>
  <circle cx="68" cy="114" r="3" fill="#25f3e6" opacity=".8"/>
  <circle cx="188" cy="114" r="3" fill="#25f3e6" opacity=".8"/>
</svg>
