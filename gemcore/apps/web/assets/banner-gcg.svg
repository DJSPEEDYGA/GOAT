<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bb-bg" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#040d16"/><stop offset=".5" stop-color="#0a2436"/><stop offset="1" stop-color="#040d16"/>
    </linearGradient>
    <linearGradient id="bb-gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f7e7b0"/><stop offset=".45" stop-color="#d9b96a"/><stop offset=".78" stop-color="#8a6d2f"/><stop offset="1" stop-color="#e8cf8e"/>
    </linearGradient>
    <linearGradient id="bb-teal" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#bffef8"/><stop offset=".5" stop-color="#25f3e6"/><stop offset="1" stop-color="#0a8f86"/>
    </linearGradient>
    <radialGradient id="bb-glo" cx=".5" cy=".5" r=".5">
      <stop stop-color="#25f3e6" stop-opacity=".45"/><stop offset="1" stop-color="#25f3e6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bb-bg)"/>
  <g stroke="#25f3e6" stroke-width="1" opacity=".06">
    <path d="M0 80h1200M0 160h1200M0 240h1200M200 0v320M600 0v320M1000 0v320"/>
  </g>

  <!-- GCG mark -->
  <g transform="translate(160,160)">
    <circle r="96" fill="url(#bb-glo)"/>
    <path d="M0 -108 96 -54 96 54 0 108 -96 54 -96 -54 Z" fill="none" stroke="url(#bb-gold)" stroke-width="4" stroke-linejoin="round"/>
    <circle cy="-108" r="5" fill="#d9b96a"/><circle cy="108" r="5" fill="#d9b96a"/>
    <text y="26" text-anchor="middle" font-family="Orbitron,'Arial Black',sans-serif"
      font-size="72" font-weight="900" letter-spacing="2" fill="url(#bb-gold)">GCG</text>
    <text y="26" text-anchor="middle" font-family="Orbitron,'Arial Black',sans-serif"
      font-size="72" font-weight="900" letter-spacing="2" fill="none" stroke="url(#bb-teal)" stroke-width=".8" opacity=".6">GCG</text>
    <path d="M-36 44 h72" stroke="url(#bb-teal)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-8 44 l8 10 8 -10" fill="url(#bb-teal)"/>
  </g>

  <!-- wordmark -->
  <text x="310" y="150" font-family="Orbitron,sans-serif" font-size="82" font-weight="900"
    letter-spacing="10" fill="url(#bb-gold)">GEM</text>
  <text x="500" y="150" font-family="Orbitron,sans-serif" font-size="82" font-weight="300"
    letter-spacing="10" fill="url(#bb-teal)">CORE</text>
  <text x="316" y="196" font-family="Orbitron,sans-serif" font-size="20" letter-spacing="14"
    fill="#7fa8b8">GRADING COMPANY</text>
  <text x="316" y="234" font-family="Rajdhani,sans-serif" font-size="15" letter-spacing="4"
    fill="#d9b96a" opacity=".9">EVIDENCE-BACKED • AI-OPERATED • HUMAN-CERTIFIED</text>

  <!-- reactor node -->
  <g transform="translate(1050,160)">
    <circle r="58" fill="none" stroke="url(#bb-gold)" stroke-width="3"/>
    <circle r="46" fill="none" stroke="#25f3e6" stroke-width="1" stroke-dasharray="4 6" opacity=".5"/>
    <circle r="20" fill="url(#bb-teal)"/>
    <path d="M0 -58v10M0 48v10M-58 0h10M48 0h10" stroke="#d9b96a" stroke-width="3"/>
  </g>

  <rect x="2" y="2" width="1196" height="316" fill="none" stroke="#1a4a5e" stroke-width="2" rx="14"/>
  <path d="M2 40 V16 Q2 2 16 2 H40 M1160 2 H1184 Q1198 2 1198 16 V40 M1198 280 V304 Q1198 318 1184 318 H1160 M40 318 H16 Q2 318 2 304 V280"
    stroke="#d9b96a" stroke-width="2.5" fill="none"/>
</svg>
