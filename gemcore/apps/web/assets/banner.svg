<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#040d16"/><stop offset=".5" stop-color="#0a2436"/><stop offset="1" stop-color="#040d16"/>
    </linearGradient>
    <linearGradient id="b-gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f7e7b0"/><stop offset=".45" stop-color="#d9b96a"/><stop offset=".75" stop-color="#8a6d2f"/><stop offset="1" stop-color="#e8cf8e"/>
    </linearGradient>
    <linearGradient id="b-teal" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#bffef8"/><stop offset=".5" stop-color="#25f3e6"/><stop offset="1" stop-color="#0a8f86"/>
    </linearGradient>
    <linearGradient id="b-gem" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#bffef8"/><stop offset=".45" stop-color="#25f3e6"/><stop offset="1" stop-color="#0a6d66"/>
    </linearGradient>
    <radialGradient id="b-glo" cx=".5" cy=".5" r=".5">
      <stop stop-color="#25f3e6" stop-opacity=".5"/><stop offset="1" stop-color="#25f3e6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#b-bg)"/>
  <!-- HUD grid -->
  <g stroke="#25f3e6" stroke-width="1" opacity=".06">
    <path d="M0 80h1200M0 160h1200M0 240h1200M200 0v320M600 0v320M1000 0v320"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(150,160)">
    <circle r="96" fill="url(#b-glo)"/>
    <path d="M0 -108 96 -54 96 54 0 108 -96 54 -96 -54 Z" fill="none" stroke="url(#b-gold)" stroke-width="4" stroke-linejoin="round"/>
    <circle cy="-108" r="5" fill="#d9b96a"/><circle cy="108" r="5" fill="#d9b96a"/>
    <path d="M0 -62 50 -16 0 66 -50 -16 Z" fill="url(#b-gem)" stroke="#bffef8" stroke-width="1.5"/>
    <path d="M0 -62 V66 M-50 -16 H50" stroke="#eafdfb" stroke-width=".9" opacity=".55"/>
    <path d="M-50 -16 -22 -16 0 6 -50 -16 Z" fill="#9cf5ec" opacity=".6"/>
    <path d="M50 -16 22 -16 0 6 50 -16 Z" fill="#5ee8db" opacity=".5"/>
  </g>

  <!-- wordmark -->
  <g>
    <text x="300" y="152" font-family="Orbitron,sans-serif" font-size="86" font-weight="900"
      letter-spacing="10" fill="url(#b-gold)">GEM</text>
    <text x="493" y="152" font-family="Orbitron,sans-serif" font-size="86" font-weight="300"
      letter-spacing="10" fill="url(#b-teal)">CORE</text>
    <text x="306" y="200" font-family="Orbitron,sans-serif" font-size="20" letter-spacing="14"
      fill="#7fa8b8">PRECISION GRADING</text>
    <text x="306" y="238" font-family="Rajdhani,sans-serif" font-size="15" letter-spacing="4"
      fill="#d9b96a" opacity=".9">EVIDENCE-BACKED • AI-OPERATED • HUMAN-CERTIFIED</text>
  </g>

  <!-- reactor node right -->
  <g transform="translate(1050,160)">
    <circle r="58" fill="none" stroke="url(#b-gold)" stroke-width="3"/>
    <circle r="46" fill="none" stroke="#25f3e6" stroke-width="1" stroke-dasharray="4 6" opacity=".5"/>
    <circle r="20" fill="url(#b-gem)"/>
    <path d="M0 -58v10M0 48v10M-58 0h10M48 0h10" stroke="#d9b96a" stroke-width="3"/>
  </g>

  <!-- frame -->
  <rect x="2" y="2" width="1196" height="316" fill="none" stroke="#1a4a5e" stroke-width="2" rx="14"/>
  <path d="M2 40 V16 Q2 2 16 2 H40 M1160 2 H1184 Q1198 2 1198 16 V40 M1198 280 V304 Q1198 318 1184 318 H1160 M40 318 H16 Q2 318 2 304 V280"
    stroke="#d9b96a" stroke-width="2.5" fill="none"/>
</svg>
