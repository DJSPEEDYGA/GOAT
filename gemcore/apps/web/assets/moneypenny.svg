<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="mp-glow" cx=".5" cy=".5" r=".55">
      <stop stop-color="#d9b96a" stop-opacity=".5"/><stop offset="1" stop-color="#d9b96a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mp-gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f5e3ae"/><stop offset=".5" stop-color="#d9b96a"/><stop offset="1" stop-color="#8a6d2f"/>
    </linearGradient>
    <linearGradient id="mp-tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0e2c3e"/><stop offset="1" stop-color="#040d16"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#mp-tile)" stroke="#3d3421" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="42" fill="url(#mp-glow)"/>

  <!-- HUD ring -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#mp-gold)" stroke-width="2"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#d9b96a" stroke-width=".8" stroke-dasharray="3 5" opacity=".6"/>
  <!-- ring ticks -->
  <g stroke="#d9b96a" stroke-width="2" stroke-linecap="round">
    <path d="M64 14v7M64 107v7M14 64h7M107 64h7"/>
  </g>
  <!-- orbit node — the AI eye -->
  <circle cx="64" cy="18" r="4" fill="#25f3e6"/>
  <circle cx="64" cy="18" r="7" fill="none" stroke="#25f3e6" stroke-width="1" opacity=".5"/>

  <!-- MP monogram -->
  <text x="64" y="78" text-anchor="middle" font-family="Georgia,serif" font-size="42"
    font-weight="bold" fill="url(#mp-gold)" letter-spacing="1">MP</text>
  <text x="64" y="94" text-anchor="middle" font-family="monospace" font-size="7.5"
    fill="#d9b96a" letter-spacing="3" opacity=".9">MONEY PENNY</text>
</svg>
